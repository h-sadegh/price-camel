name: Track prices

on:
  schedule:
    - cron: "7,37 * * * *"  # every 30 minutes (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: track
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch prices
        run: python tracker.py

      - name: Build panel
        run: python panel.py

      - name: Check alerts
        run: python alerts.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        continue-on-error: true

      - name: Commit data
        run: |
          git config user.name "price-camel bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ watched.json docs/
          if git diff --cached --quiet; then
            echo "No new data; nothing to commit."
          else
            git commit -m "chore: update price data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
